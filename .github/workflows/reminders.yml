# Sends medication reminders by pinging the app's cron endpoint every 5 minutes.
# Configure two repository secrets:
#   APP_URL      → your deployed base URL, e.g. https://pill-tracker.example.com
#   CRON_SECRET  → the same value as CRON_SECRET in the app's environment
name: Medication reminders

on:
  schedule:
    - cron: "*/5 * * * *" # every 5 minutes (GitHub may batch/delay slightly)
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger reminders
        run: |
          if [ -z "${{ secrets.APP_URL }}" ]; then
            echo "APP_URL secret not set — skipping."; exit 0
          fi
          curl -fsS -X POST "${{ secrets.APP_URL }}/api/cron/reminders" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -w "\nHTTP %{http_code}\n"
